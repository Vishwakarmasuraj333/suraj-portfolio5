  </g>

  <!-- Name & Title -->
  <text x="170" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Suraj Vishwakarma</text>
  <text x="170" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#F43F5E" letter-spacing="1.5">FULL STACK DEVELOPER</text>

