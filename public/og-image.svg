    <text x="440" y="38" font-family="monospace" font-size="15" font-weight="600" fill="#94A3B8">GitHub: @Vishwakarmasuraj333</text>
    <text x="790" y="38" font-family="monospace" font-size="15" font-weight="600" fill="#38BDF8">itxsurajofficial@gmail.com</text>
