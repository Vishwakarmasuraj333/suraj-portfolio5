    <text x="25" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">9.04 CGPA (A Grade)</text>
    <text x="200" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">B.Sc. IT • Mumbai Univ</text>
  </g>

